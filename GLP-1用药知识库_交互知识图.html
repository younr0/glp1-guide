<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173f3b">
<title>GLP-1 用药知识库 · 交互知识图</title>
<style>
:root{color-scheme:light;--paper:#f6f8f6;--ink:#193630;--muted:#4c665e;--line:#d5e3db;--teal:#226961;--deep:#173f3b;--light:#e3f1ec;--white:#fff;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink)}
main{max-width:1440px;margin:auto;padding:32px clamp(17px,4vw,54px) 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid #25756a;outline-offset:3px}
h1,h2,h3,p{margin:0}
.mast{display:flex;gap:20px;justify-content:space-between;align-items:center;margin-bottom:22px;padding:0 2px}
h1{font-size:clamp(1.65rem,3.5vw,2.55rem);letter-spacing:.015em;font-weight:750;line-height:1.25}
.intro{margin-top:8px;color:var(--muted);line-height:1.55}
.status{color:#79521e;background:#fcf0dc;border:1px solid #eedab9;border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap;font-weight:640}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.toolbar-label{font-size:15px;font-weight:650;color:#345b51}
.switches{display:flex;gap:5px;padding:4px;background:#e8efeb;border:1px solid var(--line);border-radius:12px}
.switches button{background:transparent;border:1px solid transparent;border-radius:8px;padding:7px 17px;font-size:15px}
.switches button[aria-pressed=true]{background:#fff;color:var(--teal);border-color:#c7ddd2;font-weight:700}
.stage{position:relative;display:grid;grid-template-columns:minmax(105px, .64fr) minmax(145px,1fr) minmax(153px,1.04fr) minmax(330px,2.6fr);column-gap:clamp(19px,3vw,50px);align-items:start;padding:22px clamp(14px,2vw,30px) 25px;border:1px solid var(--line);border-radius:22px;background-color:#fcfdfb;background-image:radial-gradient(#e0e9e2 1px,transparent 1px);background-size:17px 17px;isolation:isolate}
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:-1}
.lane-label{display:block;margin-bottom:16px;font-size:13px;letter-spacing:.06em;font-weight:750;color:#4a675f}
.lane-body{min-height:335px;display:flex;flex-direction:column;justify-content:center;gap:13px}
.hub{width:clamp(95px,9.5vw,136px);aspect-ratio:1;margin:auto;text-align:center;border-radius:50%;background:#e8f3ee;border:2px solid #89ada2;display:grid;place-content:center;padding:9px;box-shadow:0 0 0 6px #f3f8f4}
#drug-name{font-size:clamp(1.06rem,2vw,1.35rem);font-weight:760;color:#15463d}
#drug-generic{font-size:13px;color:var(--muted);margin-top:4px}
.node{width:100%;text-align:left;border:1px solid #bdcec6;background:#fff;border-radius:11px;padding:12px 10px;line-height:1.38;overflow-wrap:anywhere}
.node strong{display:block;font-size:15px}
.node small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.node[aria-pressed=true]{background:#e2f1ec;color:#14594e;border:1.5px solid #5e9e8c;box-shadow:0 2px 8px #143e2a11}
.node:not(:disabled):hover{border-color:#5e9e8c}
.node:disabled{background:#f0f3f1;border-color:#d9e2dc;color:#63786f;cursor:default}
.node:disabled small{color:#5e7168}
.entries .node{background:#f3f7f5}
.entries .node[aria-pressed=true]{background:#dcefe7}
.entries .node small{margin-top:0;margin-bottom:4px;font-variant-numeric:tabular-nums}
.card{border:1px solid #c5d9d0;border-radius:15px;padding:16px;background:#fbfdfa;box-shadow:0 4px 15px #203d2d09;min-width:0}
.panel-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.code{background:var(--teal);color:white;padding:5px 9px;border-radius:6px;font-size:13px;font-weight:730}
h2{font-size:clamp(1.05rem,2vw,1.35rem)}
.badge{margin-left:auto;font-size:13px;color:#79521e;font-weight:650}
.question,.answer,.tile{min-width:0;border-radius:9px;padding:11px 13px}
.question{margin:13px 0 9px;background:#dfeedf}
.hint{display:flex;align-items:baseline;gap:6px;padding:2px 5px;color:#4c665e}
.hint+.hint{margin-bottom:9px}
.answer{margin-bottom:10px;background:#e3f1ec;border-left:3px solid #508c7e}
.tile{margin-bottom:8px}
.tile.risk{background:#fbefe1}
.card h3{font-size:14px;margin-bottom:4px}
.card .hint h3{flex:none;font-size:12px;line-height:1.45;margin:0}
.card .question h3,.card .answer h3{font-size:15px}
.card p{white-space:pre-line;line-height:1.65;overflow-wrap:anywhere}
.question p{font-size:clamp(1.05rem,2vw,1.18rem);font-weight:660;line-height:1.5}
.answer p{font-size:clamp(1rem,1.65vw,1.12rem);font-weight:520;line-height:1.65}
.card .hint p{font-size:13px;line-height:1.45}
.tile p{font-size:14px}
.evidence-foot{display:flex;justify-content:flex-end;gap:7px;flex-wrap:wrap;margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;line-height:1.55;color:#4e695f;text-align:right}
.evidence-foot span:first-child{font-weight:680}
.related{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:11px}
.related span{font-size:13px;color:var(--muted);margin-right:3px}
.related button{background:#e6f2eb;border:1px solid #d2e7dd;color:#225d51;padding:6px 9px;border-radius:6px;font-size:13px}
.note{margin-top:14px;color:var(--muted);font-size:14px;line-height:1.65}
@media(max-width:1050px){.stage{grid-template-columns:105px 140px 153px minmax(290px,1fr);column-gap:18px}}
@media(max-width:790px){main{padding-top:22px}.mast{align-items:flex-start}.stage{grid-template-columns:100px minmax(120px,1fr) minmax(130px,1fr);gap:12px;align-items:start}.details-lane{grid-column:1/-1}.lane-body{min-height:260px}.hub{width:87px}}
@media(max-width:465px){.mast{flex-wrap:wrap;gap:10px;margin-bottom:15px}.toolbar{gap:8px}.stage{grid-template-columns:1fr 1fr}.drug-lane{grid-column:1/-1;display:flex;align-items:center;gap:8px}.drug-lane .lane-label{margin:0}.drug-lane .lane-body{min-height:0}.hub{width:auto;aspect-ratio:auto;text-align:left;border-radius:8px;padding:5px 9px;display:flex;align-items:baseline;gap:6px;box-shadow:none}#drug-generic{margin:0}.lane-label{margin-bottom:8px}.lane-body{min-height:0;gap:7px;justify-content:start}.node{padding:8px}.node strong{font-size:14px}.node small{font-size:12px}.stage{row-gap:18px}}

[hidden]{display:none!important}
.ask-page{max-width:780px;margin:clamp(30px,8vw,100px) auto}
.ask-page h1{font-size:clamp(1.8rem,5vw,3.15rem)}
.ask-page .status{display:inline-block;margin-bottom:15px}
.ask-form{margin-top:24px;background:white;border:1px solid var(--line);border-radius:20px;padding:clamp(17px,4vw,30px)}
.ask-form label{display:block;font-weight:700;margin-bottom:7px}
.ask-form textarea,.ask-form select{width:100%;font:inherit;color:var(--ink);padding:12px 14px;border:1px solid #afc8bd;border-radius:10px;background:#fbfdfb}
.ask-form textarea{min-height:100px;resize:vertical}
.ask-actions{display:grid;grid-template-columns:minmax(120px,1fr) auto;gap:12px;align-items:end;margin-top:13px}
.ask-actions button,.plain-button{background:var(--deep);color:white;border:1px solid var(--deep);padding:11px 16px;border-radius:9px;font-weight:650}
.plain-button{background:#fff;color:var(--deep);padding:7px 12px}
.ask-response{color:#395c53;margin-top:13px;line-height:1.6}
.ask-response:empty{display:none}
.ask-examples{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.ask-examples button{border:1px solid var(--line);background:#e8f2ec;padding:6px 10px;border-radius:8px;text-align:left}
.toolbar .plain-button{margin-right:4px}
.match-copy{margin:0 0 10px;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.entry-current{font-size:12px;color:var(--teal);font-weight:700}
</style>
</head>
<body>
<main>
  <section class="ask-page" id="ask-page" aria-labelledby="ask-title">
    <span class="status">内部试验 · 待药师审核</span>
    <h1 id="ask-title">你想问什么用药问题？</h1>
    <p class="intro">用自己的话提问，查找试验库里已有的知识条目。</p>
    <form class="ask-form" id="ask-form">
      <label for="patient-question">患者提问</label>
      <textarea id="patient-question" required maxlength="300" placeholder="例如：首针打多少，什么时候可以用 2.4 mg？"></textarea>
      <div class="ask-actions"><div><label for="ask-drug">使用的药物</label><select id="ask-drug"><option value="">未选择</option><option value="SEM">诺和盈（司美格鲁肽）</option><option value="TIR">穆峰达（替尔泊肽）</option></select></div><button type="submit">查找知识条目</button></div>
      <p class="ask-response" id="ask-response" role="status"></p>
      <div class="ask-examples" aria-label="试试这些问法">
        <button type="button" data-example="首针打多少，什么时候可以用2.4mg剂量？">首针打多少，什么时候可以用 2.4 mg？</button>
        <button type="button" data-example="诺和盈拔针太早，感觉没打够怎么办？">诺和盈拔针太早怎么办？</button>
        <button type="button" data-example="穆峰达漏打一次，已经超过96小时怎么办？">穆峰达漏打超过 96 小时怎么办？</button>
      </div>
    </form>
    <p class="note">当前收录诺和盈和穆峰达的 8 条试验条目。请勿输入姓名、联系方式等个人信息。</p>
  </section>
  <section id="graph-page" hidden aria-label="知识图查询结果">
  <header class="mast"><div><h1>GLP-1 用药知识库</h1><p class="intro">选择药物，沿模块分支打开知识单元。</p></div><span class="status">内部试验 · 待药师审核</span></header>
  <div class="toolbar"><button class="plain-button" id="ask-again" type="button">返回提问</button><span class="toolbar-label" id="drug-controls">切换药物</span><div class="switches" id="products" role="group" aria-labelledby="drug-controls"></div></div>
  <p id="match-copy" class="match-copy" hidden></p>
  <div class="stage" id="stage">
    <canvas id="lines" aria-hidden="true"></canvas>
    <section class="drug-lane"><div class="lane-label">适用药物</div><div class="lane-body"><div class="hub" id="hub"><strong id="drug-name"></strong><span id="drug-generic"></span></div></div></section>
    <section><div class="lane-label" id="module-label">知识模块</div><div class="lane-body" id="modules" role="group" aria-labelledby="module-label"></div></section>
    <section><div class="lane-label" id="entry-label">当前与相关知识点</div><div class="lane-body entries" id="entries" role="group" aria-labelledby="entry-label"></div></section>
    <section class="details-lane"><div class="lane-label">知识单元详情</div><article class="card" id="detail" aria-live="polite"></article></section>
  </div>
  <p class="note">节选自你上传的《GLP-1减重药物知识库》。本页用于检查知识组织和交互，所展示的临床内容仍待药师审核。</p>
  </section>
</main>

<script>
const data=JSON.parse(document.getElementById('kb').textContent);
const products={SEM:{name:'诺和盈',generic:'司美格鲁肽'},TIR:{name:'穆峰达',generic:'替尔泊肽'}};
const modules={
 D:'给药实施与剂量管理',
 ST:'药品保存与携带',
 M:'漏用与中断处理',
 A:'不良反应识别与就医提示'
};
let product='SEM', module='D', entry=data.SEM.D[0].id;
const allRows=Object.entries(data).flatMap(([drug,groups])=>Object.entries(groups).flatMap(
 ([group,rows])=>rows.map(row=>({...row,drug,group}))));
const byId=new Map(allRows.map(row=>[row.id,row]));
const links={
 'SEM-D-002':['SEM-M-003'],
 'SEM-D-009':['SEM-D-002'],
 'SEM-M-001':['SEM-M-002','SEM-M-003'],
 'SEM-M-002':['SEM-M-001','SEM-M-003'],
 'SEM-M-003':['SEM-D-002','SEM-M-001','SEM-M-002'],
 'TIR-D-010':['TIR-M-001','TIR-M-002'],
 'TIR-M-001':['TIR-M-002'],
 'TIR-M-002':['TIR-M-001']
};
let matchedQuestion='';
const suggestions=id=>(links[id]||[]).map(key=>byId.get(key)).filter(Boolean).slice(0,3);
const select=id=>document.getElementById(id);
const safe=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const pressed=value=>value?'true':'false';
function detailCard(row,recommendations){
 const field=(label,value,cssClass)=>'<section class="'+cssClass+'"><h3>'+label+'</h3><p>'+safe(value)+'</p></section>';
 const related=recommendations.map(x=>'<button type="button" data-entry="'+safe(x.id)+'">'+safe(x.title)+'</button>').join('');
 return '<div class="panel-head"><span class="code">'+safe(row.id)+'</span><h2>'+safe(row.title)+'</h2><span class="badge">'+safe(row.status)+'</span></div>'+
  field('典型问题',row.question,'question')+
  field('缺失信息追问',row.tip,'hint')+
  field('适用条件',row.scope,'hint')+
  field('药师回答',row.brief,'answer')+
  field('风险提示',row.risk,'tile risk')+
  (related?'<div class="related"><span>我还想问</span>'+related+'</div>':'')+
  '<footer class="evidence-foot"><span>来源与版本</span><span>'+safe(row.source)+'</span></footer>';
}
function render(focus){
 if(location.hash!=='#'+entry)history.replaceState(null,'','#'+entry);
 const row=byId.get(entry);
 const recommendations=suggestions(entry);
 const visibleRows=[row,...recommendations];
 select('drug-name').textContent=products[product].name;
 select('drug-generic').textContent=products[product].generic;
 select('products').innerHTML=Object.entries(products).map(([k,p])=>'<button type="button" data-product="'+k+'" aria-pressed="'+pressed(k===product)+'">'+p.name+'</button>').join('');
 select('modules').innerHTML=Object.entries(modules).map(([k,label])=>'<button type="button" class="node" data-module="'+k+'" aria-pressed="'+pressed(k===module)+'"'+(data[product][k]?'':' disabled')+'><strong>'+label+'</strong><small>'+(data[product][k]?data[product][k].length+' 条试用知识点':'暂未接入')+'</small></button>').join('');
 select('entries').innerHTML=visibleRows.map(x=>'<button type="button" class="node" data-entry="'+safe(x.id)+'" aria-pressed="'+pressed(x.id===entry)+'"><small>'+safe(x.id)+(x.id===entry?' · 当前条目':'')+'</small><strong>'+safe(x.title)+'</strong></button>').join('');
 select('detail').innerHTML=detailCard(row,recommendations);
 if(focus)document.querySelector(focus)?.focus({preventScroll:true});
 requestAnimationFrame(draw);
}
function draw(){
 const canvas=select('lines');
 const bounds=select('stage').getBoundingClientRect();const step=window.devicePixelRatio||1;
 canvas.width=Math.round(bounds.width*step);canvas.height=Math.round(bounds.height*step);
 const ctx=canvas.getContext('2d');if(!ctx||!bounds.width||!bounds.height)return;
 ctx.scale(step,step);
 const modulesList=[...select('modules').children], entriesList=[...select('entries').children];
 const connect=(from,to,strong,ghost=false)=>{
  const a=from.getBoundingClientRect(),b=to.getBoundingClientRect();
  const horizontal=b.left>=a.right;
  const vertical=!horizontal&&b.top>=a.bottom;
  if(!horizontal&&!vertical)return;
  const x=(horizontal?a.right:a.left+a.width/2)-bounds.left;
  const y=(horizontal?a.top+a.height/2:a.bottom)-bounds.top;
  const u=(horizontal?b.left:Math.max(b.left+10,Math.min(x+bounds.left,b.right-10)))-bounds.left;
  const v=(horizontal?b.top+b.height/2:b.top)-bounds.top;
  ctx.strokeStyle=strong?'#397e70':ghost?'#a9bdb4':'#759d90';
  ctx.lineWidth=strong?2.4:1.4;
  ctx.setLineDash(ghost?[4,4]:[]);
  ctx.beginPath();
  ctx.moveTo(x,y);
  if(horizontal){
   const mid=(x+u)/2;
   ctx.bezierCurveTo(mid,y,mid,v,u,v);
  }else{
   const mid=(y+v)/2;
   ctx.bezierCurveTo(x,mid,u,mid,u,v);
  }
  ctx.stroke();
 };
 for(const el of modulesList)connect(select('hub'),el,el.dataset.module===module,el.disabled);
 for(const el of entriesList){
  const selected=el.dataset.entry===entry;
  const targetModule=modulesList.find(node=>node.dataset.module===byId.get(el.dataset.entry).group);
  connect(targetModule,el,selected);
  if(selected)connect(el,select('detail'),true);
 }
}
select('products').addEventListener('click',event=>{
 const key=event.target.closest('button[data-product]')?.dataset.product;
 if(!key||key===product)return;
 product=key;entry=data[product][module][0].id;
 render('[data-product="'+product+'"]');
});
select('modules').addEventListener('click',event=>{
 const key=event.target.closest('button[data-module]:enabled')?.dataset.module;
 if(!key||key===module)return;
 module=key;entry=data[product][module][0].id;
 render('[data-module="'+module+'"]');
});
function bindEntry(container){
 select(container).addEventListener('click',event=>{
  const key=event.target.closest('button[data-entry]')?.dataset.entry;
  if(!key||key===entry)return;
  if(!byId.has(key))return;
  ({drug:product,group:module,id:entry}=byId.get(key));
  render('#entries [data-entry="'+entry+'"]');
 });
}
bindEntry('entries');bindEntry('detail');
const normalize=value=>value.normalize('NFKC').toLowerCase().replace(/\s+/g,'');
function lookup(raw,selectedDrug){
 const q=normalize(raw);
 const named=[[/诺和盈|司美格鲁肽|wegovy/,'SEM'],[/穆峰达|替尔泊肽|mounjaro/,'TIR']].filter(([pattern])=>pattern.test(q));
 if(named.length>1) return {message:'问题提到两种药物。请分别提问，便于核对各自的用药条件。'};
 if(/诺和泰|穆优达|奥氟格列隆|利鲁平|菲塑美|信尔美|先维盈|口服|片剂/.test(q))
  return {message:'这次输入涉及试验库暂未接入的产品或剂型，暂时没有可显示的条目。'};
 if(named.length&&selectedDrug&&named[0][1]!==selectedDrug)
  return {message:'问题里写的药物与下拉框所选不一致。请先确认具体药品。'};
 const drug=named[0]?.[1]||selectedDrug;
 if(!drug) return {message:'请先选择或写出药盒上的商品名。试验版目前支持诺和盈和穆峰达。'};
 if(/多打|打重|打了两针|双倍|过量/.test(q))
  return {message:'试验库没有匹配到重复给药处置条目。请联系医生或药师核实。'};
 if(/怀孕|哺乳|手术|过敏|保存|放冰箱|温度|口服|胰腺炎|胸痛|呼吸困难|晕厥|连续.*呕吐/.test(q))
  return {message:'试验库暂未收录这个情景。可以换个问法，或咨询医生或药师。'};
 const shot=/拔针|针头.*溢|没打足|没打够|漏液|针尖/.test(q);
 const gap=/重启|停药|停了|断药|连续.*漏|漏打.*几次|漏打.*多次|漏打.*(?:两次|[2-9]次)/.test(q);
 const missed=/漏[打用针]|忘[了记打]|忘记|补打|遗漏/.test(q);
 const timeUnknown=/不记得|记不清|忘了.*(?:有没有|打没打|什么时候)|不确定.*(?:打没打|是否打过|有没有打)|不知道.*(?:打没打|已过|过了多久)/.test(q);
 const starting=/首针|首次|第一次|刚开始|起始|起步|从多少|开始.*打/.test(q);
 const titration=/2[.点]4|递增|加量|升剂量|维持剂量/.test(q);
 const device=/入门|培训|操作|装针|怎么用笔|怎么打|首次.*用笔|第一次.*用笔/.test(q);
 const categoryCount=[shot,gap,missed&&!gap,starting||titration].filter(Boolean).length;
 if(categoryCount>1) return {message:'这句话可能包含不同用药情景。请把问题分开提问，方便匹配。'};
 if(timeUnknown) return {message:'目前无法确认你是否已用药，或漏用时间不明确。请先核对给药记录。'};
 if(shot&&drug==='SEM') return {id:'SEM-D-009'};
 if(gap&&drug==='SEM') return {id:'SEM-M-003'};
 if(missed){
  if(/好几|几天|几小时/.test(q)&&!/[0-9]/.test(q))return {message:'请补充距离原计划用药日已经过去几天或几小时，并确认只漏用了一次。'};
  const units=q.replace(/([一二两三四五六七八九十])(?=天|小时)/g,t=>({一:1,二:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10})[t]);
  const matches=[...units.matchAll(/(超过|不超过|不到|已经过了|已过|超|小于|大于|≤|≥|>|<)?(\d+(?:\.\d+)?)(小时|天)/g)];
  const [match]=matches;
  if(matches.length!==1||/≥|大约|左右|大概|昨天|上周|计划提前|[0-9一二两三四五六七八九十][到至~～–-][0-9一二两三四五六七八九十]|[0-9]周/.test(q))return {message:'请补充准确的漏用时长，并确认只漏用了一次。'};
  const [,bound='',amount,unit]=match;
  const hours=Number(amount)*(unit==='天'?24:1);
  const threshold=drug==='SEM'?120:96;
  const upper=['不超过','不到','小于','≤','<'].includes(bound)||units.includes(match[0]+'内');
  const lower=['超过','超','大于','>'].includes(bound);
  if((upper&&hours>threshold)||(lower&&hours<threshold)||(['不到','小于','<'].includes(bound)&&hours===0))return {message:'目前的时间范围跨越了处理界值。请补充实际经过的时间。'};
  if(!upper&&!lower&&hours===0)return {message:'请确认原计划给药时间已经过去，以及实际漏用时长。'};
  const late=hours>threshold||(hours===threshold&&lower);
  return {id:drug+'-M-00'+(late?2:1)};
 }
 if((starting||titration)&&!/(提前|副作用|费用|价格|买|2[.点]4.*(?:不舒服|恶心))/.test(q)&&drug==='SEM')return {id:'SEM-D-002'};
 if(device&&drug==='TIR'&&!titration&&!/多少|剂量/.test(q))return {id:'TIR-D-010'};
 return {message:'没有找到足够匹配的试验条目。可以补充具体药品和用药情况，再试一次。'};
}
function showPage(focus=false){
 const hit=byId.get(location.hash.slice(1));
 select('ask-page').hidden=Boolean(hit);
 select('graph-page').hidden=!hit;
 if(hit){
  ({drug:product,group:module,id:entry}=hit);
  select('match-copy').textContent=matchedQuestion?'你的提问：'+matchedQuestion:'';
  select('match-copy').hidden=!matchedQuestion;
  render(focus?'#ask-again':undefined);
 }else if(focus){select('patient-question').focus();}
}
select('ask-form').addEventListener('submit',event=>{
 event.preventDefault();
 const input=select('patient-question').value.trim();
 const result=lookup(input,select('ask-drug').value);
 select('ask-response').textContent=result.message||'';
 if(result.id){matchedQuestion=input;location.hash=result.id;}
});
select('ask-again').addEventListener('click',()=>{location.hash='';});
select('ask-form').addEventListener('click',event=>{
 const example=event.target.closest('[data-example]')?.dataset.example;
 if(example){
  select('patient-question').value=example;
  select('ask-drug').value=example.includes('穆峰达')?'TIR':'SEM';
  select('ask-response').textContent='';
  select('patient-question').focus();
 }
});
window.addEventListener('hashchange',()=>showPage(true));
new ResizeObserver(()=>{if(!select('graph-page').hidden)requestAnimationFrame(draw);}).observe(select('stage'));
document.fonts?.ready.then(()=>{if(!select('graph-page').hidden)draw();});
showPage();
</script>
</body>
